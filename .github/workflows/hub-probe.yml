name: hub-probe
# 거점 사이가 먼 코스: 노선 양옆 1.5km 안의 이름 있는 명소 후보 → data/hub_probe.json (앱은 바꾸지 않음)
on:
  workflow_dispatch:
  push:
    paths: [ 'tools/hub_probe.py' ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -u tools/hub_probe.py
        timeout-minutes: 25
        continue-on-error: true
      - run: |
          git config user.name "hub-bot"; git config user.email "hub-bot@users.noreply.github.com"
          git add data/hub_probe*.json
          git commit -m "거점 보강 후보 (오픈스트리트맵)" || echo "no change"
          git pull --rebase origin main && git push origin HEAD:main
