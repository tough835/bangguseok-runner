name: osm-probe
# 노선 ↔ 오픈스트리트맵 길 대조 (엉뚱한 좌표 · 자전거길에 산길 · 계단) → data/route_osm_probe.json
on:
  workflow_dispatch:
  push:
    paths: [ 'tools/route_osm_probe.py', 'data/osm_probe_list.json' ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: timeout 2200 python -u tools/route_osm_probe.py
        continue-on-error: true
      - if: always()
        run: |
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          git add data/route_osm_probe.json
          git commit -m "노선 ↔ 오픈스트리트맵 길 대조 결과 (앱 화면 변경 없음)" || echo "no change"
          git pull --rebase origin main && git push origin HEAD:main
